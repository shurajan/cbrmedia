# Ротация логов cbrservice. Устанавливается deploy/cbrservice.sh в /etc/logrotate.d/cbrservice,
# @CBR_HOME@ и @USER@/@GROUP@ подставляются при установке.
#
# copytruncate: systemd держит лог открытым (StandardOutput=append:...),
# поэтому файл копируется и обнуляется на месте — перезапуск службы не нужен.
@CBR_HOME@/logs/*.log {
    su @USER@ @GROUP@
    daily
    rotate 14
    maxsize 100M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    dateext
    dateformat -%Y%m%d-%s
}
