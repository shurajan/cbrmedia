version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - usestdlibvars
  settings:
    gosec:
      excludes:
        - G304 # чтение файлов по путям из конфига и медиатеки — штатное поведение
        - G204 # запуск ffmpeg/ffprobe с путём к записи или файлу медиатеки
    revive:
      rules:
        - name: exported
          disabled: false
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [errcheck, gosec, bodyclose]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - cbr/
