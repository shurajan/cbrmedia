<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cbr — live player</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text","Helvetica Neue",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#FFFFFF;text-decoration:none}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</helmet>
<!-- Модальный живой плеер (fullScreenCover поверх Watchlist): как плеер записей, но без перемотки -->
<div style="width: 1194px; height: 834px; box-sizing: border-box; background: #000000; color: #FFFFFF; position: relative; overflow: hidden">
  <!-- Кадр стрима (заглушка) -->
  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse at 35% 40%, #3a4f5a 0%, #1b2a31 45%, #07100f 100%)"></div>

  <!-- Оверлей управления: затемнение 35 %, скрывается через 3 с при воспроизведении, тап — показать/скрыть -->
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,.35); display: flex; flex-direction: column">

    <!-- Верх: закрыть · имя и LIVE · заполнение экрана (как у плеера записей + подпись по центру) -->
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 0">
    <a href="Watchlist.dc.html" aria-label="Close" style="width: 53px; height: 53px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 0 4px rgba(0,0,0,.6))">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
      <div style="display: flex; align-items: center; gap: 10px; text-shadow: 0 0 4px rgba(0,0,0,.6)">
        <span style="font-size: 17px; font-weight: 600">alice</span>
      </div>
      <button type="button" aria-label="Fill screen" style="width: 53px; height: 53px; display: flex; align-items: center; justify-content: center; background: none; border: 0; padding: 0; cursor: pointer; filter: drop-shadow(0 0 4px rgba(0,0,0,.6))">
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3h7v7M10 21H3v-7M21 3l-7 7M3 21l7-7"/></svg>
      </button>
    </div>

    <div style="flex: 1"></div>

    <!-- Центр: только пауза/воспроизведение, без ±10 с. Play после паузы возвращает к живому краю -->
    <div style="display: flex; justify-content: center">
      <button type="button" aria-label="Pause" style="width: 76px; height: 76px; display: flex; align-items: center; justify-content: center; background: none; border: 0; padding: 0; cursor: pointer; filter: drop-shadow(0 0 4px rgba(0,0,0,.6))">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
      </button>
    </div>

    <div style="flex: 1"></div>

    <!-- Низ: вместо времени и бегунка — плашка LIVE (точка recording) и сколько смотрим -->
    <div style="display: flex; align-items: center; gap: 12px; padding: 0 16px 28px">
      <div style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: rgba(0,0,0,.5)">
        <span style="width: 8px; height: 8px; border-radius: 4px; background: #FF6B6B"></span>
        <span style="font-size: 13px; font-weight: 700; letter-spacing: .06em">LIVE</span>
      </div>
      <span style="font-size: 13px; font-variant-numeric: tabular-nums; text-shadow: 0 0 4px rgba(0,0,0,.6)">Watching 12:48</span>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
